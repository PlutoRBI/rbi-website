<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            padding: 20px 30px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .input-section {
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #categorySelect {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        #categorySelect:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .filter-section {
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e9ecef;
            background-color: #f8f9fa;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tasks-section {
            padding: 20px 30px;
            max-height: 500px;
            overflow-y: auto;
        }

        .tasks-section::-webkit-scrollbar {
            width: 8px;
        }

        .tasks-section::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .tasks-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .tasks-section::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .task-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .task-item.high-priority {
            border-left-color: #ff6b6b;
            background: #fff5f5;
        }

        .task-item.medium-priority {
            border-left-color: #ffa500;
            background: #fffbf0;
        }

        .task-item.low-priority {
            border-left-color: #51cf66;
            background: #f1fdf4;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-text {
            font-size: 1rem;
            color: #333;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
            color: #999;
        }

        .category-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .category-work {
            background: #e7f5ff;
            color: #1971c2;
        }

        .category-personal {
            background: #f3f0ff;
            color: #7950f2;
        }

        .category-shopping {
            background: #fff3bf;
            color: #e67700;
        }

        .category-health {
            background: #c3fae8;
            color: #087e8b;
        }

        .category-other {
            background: #f0f0f0;
            color: #666;
        }

        .task-date {
            font-size: 0.75rem;
            color: #999;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .btn-edit {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-edit:hover {
            background: #45b7aa;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 1rem;
        }

        .actions-bar {
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #e9ecef;
            background-color: #f8f9fa;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-clear {
            background: #ff6b6b;
            color: white;
        }

        .btn-clear:hover {
            background: #ee5a52;
        }

        .btn-export {
            background: #4ecdc4;
            color: white;
        }

        .btn-export:hover {
            background: #45b7aa;
        }

        .sort-section {
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            align-items: center;
        }

        .sort-section label {
            font-weight: 600;
            color: #666;
            font-size: 0.9rem;
        }

        .sort-section select {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-input {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
        }

        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-save {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save:hover {
            background: #764ba2;
        }

        .btn-cancel {
            background: #e9ecef;
            color: #333;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #dee2e6;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .input-group {
                flex-direction: column;
            }

            .filter-section {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>✓ To-Do List</h1>
            <p>Stay organized and productive</p>
        </div>

        <!-- Statistics -->
        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                >
                <select id="categorySelect">
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                    <option value="other">Other</option>
                </select>
                <button class="btn btn-add" onclick="addTask()">Add Task</button>
            </div>
        </div>

        <!-- Sort Section -->
        <div class="sort-section">
            <label for="sortSelect">Sort by:</label>
            <select id="sortSelect" onchange="updateSort()">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="priority">Priority</option>
                <option value="name">A-Z</option>
            </select>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
            <button class="filter-btn" onclick="filterTasks('high')">High Priority</button>
            <button class="filter-btn" onclick="filterTasks('work')">Work</button>
            <button class="filter-btn" onclick="filterTasks('personal')">Personal</button>
        </div>

        <!-- Tasks List -->
        <div class="tasks-section" id="tasksList">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <div class="empty-state-text">No tasks yet. Add one to get started!</div>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
            <button class="btn-small btn-export" onclick="exportTasks()">📥 Export</button>
            <button class="btn-small btn-clear" onclick="clearCompleted()">🗑️ Clear Completed</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-body">
                <input type="text" id="editTaskInput" class="modal-input" placeholder="Task description">
                <select id="editPrioritySelect" class="modal-input">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <select id="editCategorySelect" class="modal-input">
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Data structure
        let tasks = [];
        let currentFilter = 'all';
        let currentSort = 'date-desc';
        let editingTaskId = null;

        // Initialize
        function init() {
            loadTasks();
            renderTasks();
            attachEventListeners();
        }

        // Local Storage Functions
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            const stored = localStorage.getItem('tasks');
            tasks = stored ? JSON.parse(stored) : [];
        }

        // Event Listeners
        function attachEventListeners() {
            document.getElementById('taskInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        }

        // Add Task
        function addTask() {
            const input = document.getElementById('taskInput');
            const category = document.getElementById('categorySelect').value;
            const text = input.value.trim();

            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                completed: false,
                category: category,
                priority: 'medium',
                createdDate: new Date().toISOString()
            };

            tasks.unshift(task);
            saveTasks();
            input.value = '';
            renderTasks();
            updateStats();
        }

        // Delete Task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        // Toggle Task Completion
        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        // Open Edit Modal
        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                editingTaskId = id;
                document.getElementById('editTaskInput').value = task.text;
                document.getElementById('editPrioritySelect').value = task.priority;
                document.getElementById('editCategorySelect').value = task.category;
                document.getElementById('editModal').classList.add('active');
            }
        }

        // Close Edit Modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }

        // Save Edit
        function saveEdit() {
            if (editingTaskId !== null) {
                const task = tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.text = document.getElementById('editTaskInput').value.trim();
                    task.priority = document.getElementById('editPrioritySelect').value;
                    task.category = document.getElementById('editCategorySelect').value;
                    saveTasks();
                    renderTasks();
                    updateStats();
                    closeEditModal();
                }
            }
        }

        // Filter Tasks
        function filterTasks(filter) {
            currentFilter = filter;
            updateFilterButtons();
            renderTasks();
        }

        // Update Filter Buttons
        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Update Sort
        function updateSort() {
            currentSort = document.getElementById('sortSelect').value;
            renderTasks();
        }

        // Get Filtered Tasks
        function getFilteredTasks() {
            let filtered = tasks;

            if (currentFilter === 'pending') {
                filtered = filtered.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filtered = filtered.filter(t => t.completed);
            } else if (currentFilter === 'high') {
                filtered = filtered.filter(t => t.priority === 'high');
            } else if (currentFilter === 'work' || currentFilter === 'personal') {
                filtered = filtered.filter(t => t.category === currentFilter);
            }

            return filtered;
        }

        // Sort Tasks
        function getSortedTasks(tasksToSort) {
            const sorted = [...tasksToSort];

            if (currentSort === 'date-asc') {
                sorted.sort((a, b) => new Date(a.createdDate) - new Date(b.createdDate));
            } else if (currentSort === 'priority') {
                const priorityOrder = { 'high': 0, 'medium': 1, 'low': 2 };
                sorted.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
            } else if (currentSort === 'name') {
                sorted.sort((a, b) => a.text.localeCompare(b.text));
            } else {
                sorted.sort((a, b) => new Date(b.createdDate) - new Date(a.createdDate));
            }

            return sorted;
        }

        // Get Priority Badge Color
        function getPriorityClass(priority) {
            switch(priority) {
                case 'high': return 'high-priority';
                case 'medium': return 'medium-priority';
                case 'low': return 'low-priority';
                default: return '';
            }
        }

        // Get Category Badge Class
        function getCategoryClass(category) {
            return `category-${category}`;
        }

        // Format Date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        // Render Tasks
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            const filtered = getFilteredTasks();
            const sorted = getSortedTasks(filtered);

            if (sorted.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-text">${currentFilter === 'all' ? 'No tasks yet. Add one to get started!' : 'No tasks found.'}</div>
                    </div>
                `;
                return;
            }

            tasksList.innerHTML = sorted.map(task => `
                <div class="task-item ${getPriorityClass(task.priority)} ${task.completed ? 'completed' : ''}">
                    <input 
                        type="checkbox" 
                        class="checkbox" 
                        ${task.completed ? 'checked' : ''}
                        onchange="toggleComplete(${task.id})"
                    >
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-meta">
                            <span class="category-badge ${getCategoryClass(task.category)}">${task.category.toUpperCase()}</span>
                            <span class="task-date">${formatDate(task.createdDate)}</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-edit" onclick="openEditModal(${task.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Update Statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
        }

        // Clear Completed Tasks
        function clearCompleted() {
            if (tasks.some(t => t.completed)) {
                if (confirm('Are you sure you want to delete all completed tasks?')) {
                    tasks = tasks.filter(t => !t.completed);
                    saveTasks();
                    renderTasks();
                    updateStats();
                }
            } else {
                alert('No completed tasks to clear.');
            }
        }

        // Export Tasks
        function exportTasks() {
            if (tasks.length === 0) {
                alert('No tasks to export!');
                return;
            }

            const dataStr = JSON.stringify(tasks, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `tasks-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
